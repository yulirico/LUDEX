services:
  - type: web
    name: ludex
    runtime: node
    plan: free
    buildCommand: cd Frontend && npm ci && npm run build && cd ../Backend && npm ci
    startCommand: cd Backend && npm run seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
